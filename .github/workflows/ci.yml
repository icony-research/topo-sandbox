name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # CI では Kinect も GPU も使えないため、それらを必要としない範囲だけを検証する。
      # 具体的には 8bit 変換・配色テーブル・点群化・DEM/等高線。
      # 彩色本体（cupy + open3d）と GUI は実機での確認が必要。
      - name: 依存パッケージの導入
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless pytest ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest
